# tmux for Claude Code sessions (managed together with ~/.local/bin/roost)
# Cheat sheet: Ctrl-b w = list/pick session   Ctrl-b d = detach   Ctrl-b [ = scroll (mouse wheel works too)
#              Ctrl-b 1..9 = jump to window   Ctrl-b r = reload this file
# windows opened by hand (Ctrl-b c) get the user-bus variables too, so `systemctl --user` works in them
set -g default-command 'export XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus; exec bash -l'
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g aggressive-resize on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# from the Claude Code terminal docs: Shift+Enter, passthrough
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'
set -g default-terminal "tmux-256color"

# status bar: window names carry the Claude state (set by ~/.claude/hooks/roost-hook.sh)
#   ● working   ? needs your decision/permission   * finished, waiting for your message   ○ quiet
#   bottom bar lists only windows that are busy / need a decision / wait for you (the dash window and the current window are always shown)
#   right side: counts (●busy ?decide *wait ○idle ⏸parked) and / usage. Click a line in the dash window to jump to that session.
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left ' roost '
set -g status-left-length 8
set -g status-right-length 60
set -g status-right '#(@ROOST_BIN@ status) #[fg=colour245]%H:%M '
# terminal tab title: "🐦 roost", plus the sessions that wait for you ("🐦 roost  ?1 *2"); refreshed with the status bar
set -g set-titles on
set -g set-titles-string '#(@ROOST_BIN@ title)'
setw -g window-status-separator ''
setw -g window-status-format '#{?#{||:#{==:#{window_name},dash},#{||:#{==:#{@roost_state},busy},#{||:#{==:#{@roost_state},attention},#{==:#{@roost_state},waiting}}}}, #I:#W#{?#{==:#{@roost_state},busy},#[fg=colour214] ●,#{?#{==:#{@roost_state},attention},#[fg=colour201] ?,#[fg=colour51] *}}#[default] ,}'
setw -g window-status-current-format '#[reverse]#[bold] #I:#W#{?#{==:#{@roost_state},busy}, ●,#{?#{==:#{@roost_state},attention}, ?,#{?#{==:#{@roost_state},waiting}, *,#{?#{==:#{@roost_state},idle}, ○,}}}} #[default]'

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# click a session line in the `dash` window to jump to it (other panes keep the default click behaviour)
bind -n MouseDown1Pane if -F '#{==:#{window_name},dash}' { run-shell -b "@ROOST_BIN@ click #{q:mouse_line} #{session_name}" } { select-pane -t = ; send-keys -M }
