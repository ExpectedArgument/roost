# Auto-recovery from kernel-level stalls (nothing here kills ordinary processes):
#  - a CPU stuck with interrupts disabled (NMI watchdog already on) -> panic instead of freezing forever
#  - after any panic reboot by itself after 10 s instead of waiting for the power button
# Deliberately NOT set: hung_task_panic (FUSE/NFS stalls would reboot the box), panic_on_oops, softlockup_panic.
kernel.hardlockup_panic = 1
kernel.panic = 10
