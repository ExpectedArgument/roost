# Hard stalls with no log (NVMe root, journal just stops): disabling NVMe autonomous power-state
# transitions (APST) is the usual first mitigation. Costs ~1 W idle. Revert: delete this file + update-grub.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nvme_core.default_ps_max_latency_us=0"
# After an unclean boot Ubuntu's GRUB waits 30 s with the menu; 3 s is enough.
GRUB_RECORDFAIL_TIMEOUT=3
